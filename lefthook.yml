# Pre-push: local mirror of the CI check job's fast gates (not full tests).
# Devcontainer: binary is in the image; `lefthook install` runs on every attach
# (see .devcontainer/post-start.sh). Host: https://lefthook.dev then `lefthook install`.
#
# CI still runs `make check` + doctest + smoke + cargo-sources;
# `make test` / coverage stay CI-only.

pre-push:
  parallel: true
  commands:
    check-fmt:
      run: make check-fmt
    clippy:
      run: make clippy
    deny:
      run: make deny
    machete:
      run: make machete
    cargo-sources:
      run: scripts/linux/packaging/flatpak/check-cargo-sources.sh
