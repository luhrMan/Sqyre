[package]
name = "sqyre-vision"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Image search / find-pixel / OCR helpers over sqyre-match"

[lints]
workspace = true

[dependencies]
image = { workspace = true }
parking_lot = { workspace = true }
pulp = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
sqyre-match = { path = "../sqyre-match" }
sqyre-domain = { path = "../sqyre-domain" }
sqyre-ports = { path = "../sqyre-ports" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ocrs = { workspace = true }
rten = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "vision_hot_paths"
harness = false
