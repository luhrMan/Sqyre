[package]
name = "sqyre-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OS AutomationBackend (rustautogui on X11/Windows; Wayland RemoteDesktop portal)"

[lints]
workspace = true

[dependencies]
sqyre-ports = { path = "../sqyre-ports" }
rustautogui = { workspace = true }
arboard = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
sqyre-capture = { path = "../sqyre-capture" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
