[package]
name = "sqyre-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ScreenCapturer for absolute virtual-desktop rects (Linux X11; Windows GDI; macOS stub); selection outline/grab + window focus on Linux/Windows"

[lints]
workspace = true

[features]
default = []
# Wayland portal ScreenCast + PipeWire (needs libpipewire ≥ 1.0 dev headers at build time).
portal-capture = ["dep:ashpd", "dep:pipewire", "dep:pollster", "dep:enumflags2", "dep:reis", "dep:libc"]

[dependencies]
sqyre-ports = { path = "../sqyre-ports" }
image = { workspace = true }
pulp = { workspace = true }
rayon = { workspace = true }
parking_lot = { workspace = true }
web-time = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { workspace = true }
ashpd = { version = "0.11", default-features = false, features = ["async-std"], optional = true }
pipewire = { version = "0.10", optional = true }
pollster = { version = "0.4", optional = true }
enumflags2 = { version = "0.7", optional = true }
reis = { version = "0.7.1", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
