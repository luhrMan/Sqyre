[package]
name = "sqyre-overlay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Floating macro overlay buttons (icons + OS viewports); iterated separately from sqyre-app"

[lints]
workspace = true

[[bin]]
name = "overlay_sandbox"
path = "src/bin/overlay_sandbox.rs"
required-features = ["sandbox"]

[features]
default = ["runtime"]
# Focus / X11 geometry / skip-taskbar for live overlay windows.
runtime = ["dep:sqyre-capture", "dep:sqyre-hotkeys"]
# Tiny eframe harness to iterate overlays without building sqyre-app.
sandbox = ["runtime", "dep:eframe"]

[dependencies]
egui = { workspace = true }
egui-phosphor = { workspace = true }
parking_lot = { workspace = true }
sqyre-ui-theme = { path = "../sqyre-ui-theme" }
sqyre-domain = { path = "../sqyre-domain" }
thiserror = { workspace = true }
sqyre-persist = { path = "../sqyre-persist" }
sqyre-ports = { path = "../sqyre-ports" }
web-time = { workspace = true }
fontdue = "0.9"
epaint_default_fonts = "0.36"
image = { workspace = true }
sqyre-capture = { path = "../sqyre-capture", optional = true }
eframe = { workspace = true, optional = true, features = ["glow"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { workspace = true }
libc = { workspace = true }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
sqyre-hotkeys = { path = "../sqyre-hotkeys", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
sqyre-android = { path = "../sqyre-android" }

[target.'cfg(target_os = "windows")'.dependencies]
sqyre-hotkeys = { path = "../sqyre-hotkeys", optional = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
