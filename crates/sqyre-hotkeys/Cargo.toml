[package]
name = "sqyre-hotkeys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Global hotkeys (Esc stop / failsafe); stubs for CI"

[features]
default = []
# Enable OS-level hooks (needs display / input permissions).
hooks = ["dep:rdev"]
# Wayland: macro chords via the GlobalShortcuts portal (compositor-owned, user-editable).
portal-shortcuts = ["hooks", "dep:ashpd", "dep:pollster", "dep:futures-util", "dep:async-io"]

[lints]
workspace = true

[dependencies]
parking_lot = { workspace = true }
sqyre-domain = { path = "../sqyre-domain" }
thiserror = { workspace = true }
rdev = { workspace = true, optional = true }
web-time = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
evdev-rs = "0.6"
epoll = "4.4"
ashpd = { version = "0.11", default-features = false, features = ["async-std"], optional = true }
pollster = { version = "1.0", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
async-io = { version = "2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
