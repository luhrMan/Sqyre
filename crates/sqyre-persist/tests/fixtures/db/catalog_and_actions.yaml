macros:
  Catalog demo:
    name: Catalog demo
    globaldelay: 0
    keyboarddelay: 0
    mousedelay: 0
    hotkey: []
    variables: []
    root:
      type: loop
      name: root
      count: 1
      subactions:
        - type: wait
          time: 10
        - type: loop
          name: inner
          count: 2
          subactions:
            - type: click
              button: left
              state: tap
        - type: conditional
          name: always
          match: all
          clauses:
            - left: "1"
              operator: "=="
              right: "1"
          subactions:
            - type: type
              text: hi
              delayms: 0
