        name: Gem
        mask: ""
        stackmax: 0
        gridsize: [0, 0]
        tags: []
    coordinates:
      1920x1080:
        scale: 1.0
        points:
          Center:
            name: Center
            x: 500
            y: 300
        searchareas:
          Main:
            name: Main
            leftx: 0
            topy: 0
            rightx: 100
            bottomy: 100
    masks: {}
    collections: {}
    atlases: {}
