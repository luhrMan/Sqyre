[package]
name = "sqyre-update"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Check GitHub Releases and self-replace Sqyre desktop binaries"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
ureq = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
