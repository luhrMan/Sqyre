[package]
name = "sqyre-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sqyre desktop shell (egui / eframe); WASM GUI editor without native runtime"

[lib]
name = "sqyre_app"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sqyre"
path = "src/main.rs"

[features]
# Full desktop runtime: macro execution, screen capture, OCR/vision.
default = ["native-runtime", "hooks", "overlay-buttons"]
# Wayland portal ScreenCast + PipeWire (needs libpipewire ≥ 1.0 dev headers).
portal-capture = ["sqyre-capture/portal-capture", "sqyre-probe/portal-capture"]
native-runtime = ["dep:sqyre-executor", "dep:sqyre-vision", "dep:sqyre-match", "dep:sqyre-capture", "dep:sqyre-probe", "sqyre-overlay/runtime"]
# OS global hotkeys (rdev). Disabled for wasm builds (`--no-default-features`).
hooks = ["sqyre-hotkeys/hooks"]
# Floating macro overlay OS windows (Linux: native X11 host thread).
overlay-buttons = []

[lints]
workspace = true

[build-dependencies]
winresource = "0.1"

[dependencies]
# `glow`: Windows overlay button per-pixel alpha (wgpu DX12 HWND swapchains are opaque).
# `wgpu`: Linux Wayland deferred viewports need wgpu for per-pixel alpha (glow child GL configs).
eframe = { workspace = true, features = ["glow", "wgpu"] }
egui = { workspace = true }
egui-phosphor = { workspace = true }
egui_ltreeview = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
sqyre-domain = { path = "../sqyre-domain" }
sqyre-ui-model = { path = "../sqyre-ui-model" }
sqyre-ports = { path = "../sqyre-ports" }
sqyre-persist = { path = "../sqyre-persist" }
sqyre-validate = { path = "../sqyre-validate" }
sqyre-varref = { path = "../sqyre-varref" }
sqyre-executor = { path = "../sqyre-executor", optional = true }
sqyre-serialize = { path = "../sqyre-serialize" }
sqyre-capture = { path = "../sqyre-capture", optional = true }
sqyre-probe = { path = "../sqyre-probe", optional = true }
sqyre-hotkeys = { path = "../sqyre-hotkeys" }
sqyre-overlay = { path = "../sqyre-overlay", default-features = false }
sqyre-vision = { path = "../sqyre-vision", optional = true }
sqyre-match = { path = "../sqyre-match", optional = true }
serde_yaml = { workspace = true }
rfd = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4"
sqyre-input = { path = "../sqyre-input" }
sqyre-update = { path = "../sqyre-update" }
winit = "0.30"

# Linux: decode with rodio, play via cpal PulseAudio (PipeWire pulse socket).
# Avoids ALSA pipewire-plugin path + cpal timestamp errors on that plugin.
[target.'cfg(all(not(target_arch = "wasm32"), target_os = "linux"))'.dependencies]
ksni = { workspace = true }
rodio = { version = "0.22", default-features = false, features = ["mp3"] }
cpal = { version = "0.18", default-features = false, features = ["pulseaudio"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "linux")))'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3"] }

[target.'cfg(all(not(target_arch = "wasm32"), any(target_os = "windows", target_os = "macos")))'.dependencies]
tray-icon = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element"] }
log = { workspace = true }
console_error_panic_hook = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { workspace = true }
sqyre-executor = { path = "../sqyre-executor" }
sqyre-capture = { path = "../sqyre-capture" }
