<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sqyre (WASM editor)</title>
<meta name="description" content="Sqyre browser editor: build no-code desktop macros for mouse, keyboard, image search, and OCR automation. Learn more at luhrman.dev/sqyre." />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #1a1a1a;
    overflow: hidden;
  }
  #sqyre_canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
<body>
  <canvas id="sqyre_canvas"></canvas>
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="4" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-simd" data-bin="sqyre" data-cargo-no-default-features data-cargo-profile-release="dist" />
</body>
</html>
