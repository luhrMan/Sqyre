[workspace]
resolver = "2"
members = [
    "crates/sqyre-varref",
    "crates/sqyre-domain",
    "crates/sqyre-ui-model",
    "crates/sqyre-ui-theme",
    "crates/sqyre-serialize",
    "crates/sqyre-validate",
    "crates/sqyre-persist",
    "crates/sqyre-ports",
    "crates/sqyre-executor",
    "crates/sqyre-match",
    "crates/sqyre-vision",
    "crates/sqyre-input",
    "crates/sqyre-capture",
    "crates/sqyre-hotkeys",
    "crates/sqyre-update",
    "crates/sqyre-overlay",
    "crates/sqyre-app",
    "crates/sqyre-probe",
]
default-members = [
    "crates/sqyre-match",
    "crates/sqyre-app",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/luhrMan/Squire"

# Shared lint policy. Opt in per crate with `[lints] workspace = true`.
# CI enforces these as errors via `make clippy` (`-D warnings`).
[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
all = "warn"

# Day-to-day `cargo build --release` / `make release`: fast incremental rebuilds.
# Strip is cheap and keeps local release binaries smaller.
[profile.release]
strip = "symbols"

# Shipping artifacts only (AppImage, Flatpak, Windows, WASM, release-bundle).
# Thin LTO + single codegen unit shrink binaries but make repeat links/compiles slow.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[workspace.dependencies]
purecv = { version = "0.8.0", default-features = false, features = ["std", "parallel", "simd"] }
eframe = "0.36"
egui = "0.36"
egui-phosphor = { version = "0.14", default-features = false, features = ["regular", "fill"] }
egui_ltreeview = "0.9"
pulp = "0.22"
rayon = "1.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "js"] }
regex = "1"
dirs = "7"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
resvg = { version = "0.47", default-features = false }
rustautogui = { version = "2.5", default-features = false, features = ["lite"] }
arboard = { version = "3", default-features = false }
x11 = { version = "2", features = ["xlib", "xinerama", "xfixes", "xrandr"] }
rdev = { version = "0.5", features = ["unstable_grab"] }
parking_lot = "0.12"
# async-io (not default tokio): avoid forcing zbus/tokio, which panics accesskit's async-io thread.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
tray-icon = { version = "0.25", default-features = false }
rfd = "0.17"
rustfft = "6.4"
windows = "0.62"
serde_json = "1"
# Instant/SystemTime that work on wasm32-unknown-unknown (std panics there).
web-time = "1"
# Blocking HTTPS with rustls+ring (MinGW-friendly; avoids aws-lc-sys).
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
log = "0.4"
jsonschema = { version = "0.37", default-features = false }
