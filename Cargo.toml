[workspace]
resolver = "2"
members = [
    "crates/sqyre-varref",
    "crates/sqyre-domain",
    "crates/sqyre-ui-model",
    "crates/sqyre-ui-theme",
    "crates/sqyre-serialize",
    "crates/sqyre-validate",
    "crates/sqyre-persist",
    "crates/sqyre-ports",
    "crates/sqyre-executor",
    "crates/sqyre-match",
    "crates/sqyre-vision",
    "crates/sqyre-input",
    "crates/sqyre-capture",
    "crates/sqyre-hotkeys",
    "crates/sqyre-update",
    "crates/sqyre-overlay",
    "crates/sqyre-app",
    "crates/sqyre-android",
    "crates/sqyre-probe",
]
default-members = [
    "crates/sqyre-match",
    "crates/sqyre-app",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/luhrMan/Sqyre"
homepage = "https://luhrman.dev/sqyre/"

# Shared lint policy; every crate opts in with `[lints] workspace = true`.
# CI enforces these as errors via `make clippy` (`-D warnings`).
[workspace.lints.rust]
unused = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"

# Day-to-day `cargo build --release` / `make release`: thin LTO for better
# match/FFT/pulp codegen. Leave `codegen-units` at the Cargo default so incremental
# and CI link times stay tolerable (shipping uses `[profile.dist]` below).
# Strip is cheap and keeps local release binaries smaller.
# Optional local-only: `RUSTFLAGS='-C target-cpu=native'` — never for AppImage/Windows.
[profile.release]
strip = "symbols"
lto = "thin"

# `make dev`: release opts without LTO so warm rebuilds only recompile touched crates.
[profile.proto]
inherits = "release"
lto = false

# Shipping artifacts only (AppImage, Flatpak, Windows, WASM, release-bundle).
# Single codegen unit on top of thin LTO shrinks binaries further but slows links.
[profile.dist]
inherits = "release"
codegen-units = 1

# OCR inference and template matching must stay optimized even in debug builds:
# `make android` defaults to a debug APK and unoptimized match kernels take
# minutes per frame on ARM (multi-second image search). Also keeps debug
# `bin/sqyre` search/OCR usable.
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-model-file]
opt-level = 3
[profile.dev.package.rten-onnx]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3

# Image-search / pixel-scan hot path: match kernel, FFT, SIMD dispatch, blur,
# icon decode, and the per-frame RGBA→RGB/crop copies. Same rationale as the
# ocrs overrides — debug builds stay usable on weak CPUs.
[profile.dev.package.pulp]
opt-level = 3
[profile.dev.package.purecv]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.sqyre-match]
opt-level = 3
[profile.dev.package.sqyre-vision]
opt-level = 3
[profile.dev.package.sqyre-capture]
opt-level = 3
[profile.dev.package.sqyre-android]
opt-level = 3

[workspace.dependencies]
purecv = { version = "0.11.0", default-features = false, features = ["std", "parallel", "simd"] }
eframe = "0.36"
egui = "0.37"
egui-phosphor = { version = "0.14", default-features = false, features = ["regular", "fill"] }
egui_ltreeview = "0.9"
pulp = "0.22"
rayon = "1.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Event-level pre-parse guard for untrusted YAML (safe Rust libyaml port).
libyaml-safer = "0.3"
uuid = { version = "1", features = ["v4", "js"] }
regex = "1"
dirs = "7"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
resvg = { version = "0.48", default-features = false }
rustautogui = { version = "2.5", default-features = false, features = ["lite"] }
arboard = { version = "3", default-features = false }
x11 = { version = "2", features = ["xlib", "xinerama", "xfixes", "xrandr"] }
rdev = { version = "0.5", features = ["unstable_grab"] }
parking_lot = "0.12"
jni = { version = "0.22", default-features = false }
# async-io (not default tokio): avoid forcing zbus/tokio, which panics accesskit's async-io thread.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
tray-icon = { version = "0.26", default-features = false }
rfd = "0.17"
rustfft = "6.4"
windows = "0.62"
serde_json = "1"
# Instant/SystemTime that work on wasm32-unknown-unknown (std panics there).
web-time = "1"
# Blocking HTTPS with rustls+ring (MinGW-friendly; avoids aws-lc-sys).
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
# OCR engine: pure-Rust NN pipeline on the rten runtime; models are ONNX files.
ocrs = { version = "0.13", default-features = false, features = ["onnx"] }
rten = { version = "0.26", features = ["onnx_format"] }
log = "0.4"
jsonschema = { version = "0.58", default-features = false }
