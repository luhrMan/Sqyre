# CI on push/PR to main. Daily release at 23:00 UTC when main has changed.
# Releases: Linux binary + AppImage + Flatpak, Windows .exe (MinGW cross), WASM editor zip,
# signed Android APK (arm64).
# Release tag / artifact names: vYYYY.MM.DD (e.g. v2026.03.03); HHMM suffix if that tag exists.
#
# Caching (share what can be shared):
# - Cargo registry (.cache/cargo): one key for all Linux jobs — warmed once per run.
#   Fixed per Cargo.lock: lockfiles fully describe deps, so no write-back needed.
# - Cargo target/: per triple (linux host / windows-gnu / wasm32 / android)
#   — not cross-shareable. Fixed per lockfile epoch; deps dominate, workspace
#   crates rebuild anyway.
# - sccache (.cache/sccache-{linux,windows}): rolling keys (<epoch>-<run_id>-<job>)
#   so compile entries accumulate across commits; restore prefers the same
#   Cargo.lock/Dockerfile epoch, then any epoch.
# - Linux/Windows Docker images: content-hash tags on GHCR; Buildx layers as fallback
# - .devcontainer/Dockerfile is multi-stage: `base` (sqyre-linux-build, slim —
#   no Android toolchain) for check/test/build-linux/build-wasm; `android`
#   (sqyre-android-build = base + SDK/NDK/emulator) for check-android/build-android
# - OCR models (assets/ocr-models): keyed on the pin hashes in the download script
# - Flatpak runtimes + flatpak-builder state: rolling, keyed on the manifest epoch
# - Trunk tools (wasm-bindgen/wasm-opt), AppImage type2-runtime, Gradle user home,
#   Windows rustup toolchains — keyed on the inputs that pin their versions
# Shared cache steps live in .github/actions/setup-rust-caches (composite);
# actions/cache only saves when the key is new, so the rolling sccache entry is
# post-saved under this run's unique key. Gradle/Flatpak keep explicit
# restore+save because their paths differ.
# Release builds skip release-gate via SQYRE_SKIP_GATE=1 — the check job already
# gated the same commit; releases on schedule/dispatch reuse that result.
# Criterion benches (`make bench`) are local-only; Linux `check` runs fmt/clippy/
# deny/machete/doctest/smoke/wasm-check, `test` runs instrumented coverage.

name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    # End of day UTC — only publishes when main moved since the last release tag.
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  # Shared with docker run mounts (see jobs below).
  CARGO_HOME_DIR: .cache/cargo
  CARGO_TARGET_DIR_HOST: target
  # Push runnable images from non-fork PRs and all other events.
  GHCR_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  version:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      # github.sha: main tip on schedule, the dispatched ref on dispatch — the
      # same tree the build jobs check out via version.outputs.sha.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Decide whether to release
        id: check
        run: |
          set -euo pipefail
          # Latest SemVer-ish / date tag (vYYYY.MM.DD or vYYYY.MM.DD.HHMM).
          LATEST_TAG="$(git tag -l 'v*' --sort=-version:refname | head -n1 || true)"

          if [ -z "$LATEST_TAG" ]; then
            echo "No prior release tag; releasing HEAD."
            SHOULD_RELEASE=true
          else
            # Match push paths-ignore: ignore docs-only / markdown-only changes.
            RELEASABLE="$(git diff --name-only "${LATEST_TAG}..HEAD" \
              | grep -Ev '(^docs/|\.md$)' || true)"
            if [ -n "$RELEASABLE" ]; then
              echo "Releasable changes since ${LATEST_TAG}:"
              echo "$RELEASABLE"
              SHOULD_RELEASE=true
            else
              echo "No releasable changes since ${LATEST_TAG}; skipping release."
              SHOULD_RELEASE=false
            fi
          fi

          VERSION="$(date -u +%Y.%m.%d)"
          if [ "$SHOULD_RELEASE" = true ] && git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            VERSION="$(date -u +%Y.%m.%d.%H%M)"
            echo "Tag v$(date -u +%Y.%m.%d) already exists; using v${VERSION}."
          fi

          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Fail before any build job spins up: releases can't sign update
      # manifests without the configured public key in the tree.
      - name: Verify update public key is configured
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          PUBKEY_FILE="crates/sqyre-update/update_pubkey.hex"
          PUBKEY="$(tr -d '[:space:]' < "$PUBKEY_FILE")"
          if [ -z "$PUBKEY" ] || [ "$(printf '%s' "$PUBKEY" | tr '[:upper:]' '[:lower:]')" = "unconfigured" ]; then
            echo "::error::$PUBKEY_FILE must contain the configured update public key before releasing" >&2
            exit 1
          fi

  # Shared gate: push/PR always; release events only when publishing.
  # `version` is skipped on push/PR — use always() so dependents still run.
  cargo-registry:
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (needs.version.result == 'success' && needs.version.outputs.should_release == 'true')
      )
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.version.outputs.sha || github.sha }}

      - name: Cache Cargo registry (shared)
        id: reg
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_HOME_DIR }}
          key: ${{ runner.os }}-cargo-reg-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-v3-
            ${{ runner.os }}-cargo-reg-

      - name: Install Rust toolchain
        if: steps.reg.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Fetch crate sources
        if: steps.reg.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.CARGO_HOME_DIR }}"
          CARGO_HOME="${{ github.workspace }}/${{ env.CARGO_HOME_DIR }}" cargo fetch --locked

  linux-image:
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (needs.version.result == 'success' && needs.version.outputs.should_release == 'true')
      )
    needs: [version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ensure.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.version.outputs.sha || github.sha }}

      - name: Ensure Linux build image
        id: ensure
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: base
          push: ${{ env.GHCR_PUSH }}

  # Android toolchain image (base + SDK/NDK/Gradle/emulator). Only check-android
  # and build-android consume it; other jobs pull the slim base image.
  android-image:
    if: |
      always() && !cancelled() &&
      needs.linux-image.result == 'success' && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (needs.version.result == 'success' && needs.version.outputs.should_release == 'true')
      )
    needs: [version, linux-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.version.outputs.sha || github.sha }}

      - name: Ensure Android build image
        id: ensure
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          local-tag: sqyre-android-build:latest
          target: android
          push: ${{ env.GHCR_PUSH }}

  # Quality gates: fmt/clippy/deny/machete + wasm32 check + doctests + smoke.
  # Parallel with `test` (coverage) — clippy/debug vs instrumented artifacts.
  # Also gates release events: build jobs skip release-gate (SQYRE_SKIP_GATE),
  # so this is the fmt/clippy guard for schedule/dispatch runs.
  check:
    if: |
      always() && !cancelled() &&
      (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (needs.version.result == 'success' && needs.version.outputs.should_release == 'true')
      ) &&
      needs.cargo-registry.result == 'success' &&
      needs.linux-image.result == 'success'
    needs: [version, cargo-registry, linux-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.version.outputs.sha || github.sha }}

      # linux-image already built/pushed; pull or rebuild from Buildx cache (fork PRs).
      - name: Ensure Linux build image
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"

      - name: Setup Rust caches
        uses: ./.github/actions/setup-rust-caches
        with:
          lock-hash: ${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          ocr: "true"
          target-key-prefix: cargo-target-linux-v3
          target-family: cargo-target-linux
          target-paths: target
          sccache-key-prefix: sccache-linux-v1
          sccache-family: sccache-linux
          sccache-path: .cache/sccache-linux

      - name: Run Rust quality gates
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e RUSTC_WRAPPER=/usr/local/bin/sccache-rustc-wrapper \
            -e SCCACHE_DIR=/workspace/.cache/sccache-linux \
            -e SCCACHE_CACHE_SIZE=5G \
            sqyre-linux-build \
            bash -c 'set -euo pipefail
              make check
              make wasm-check
              make doctest
              make smoke
              # Committed cargo-sources.json must match Cargo.lock (flatpak deps).
              scripts/linux/packaging/flatpak/check-cargo-sources.sh
              sccache --show-stats || true'

  # Instrumented nextest run = the Linux test pass. No target/ cache: llvm-cov
  # writes under target/llvm-cov-target and the report is uploaded, so nothing
  # worth persisting is produced — sccache + registry carry the compile work.
  test:
    if: |
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.cargo-registry.result == 'success' &&
      needs.linux-image.result == 'success'
    needs: [cargo-registry, linux-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      # linux-image already built/pushed; pull or rebuild from Buildx cache (fork PRs).
      - name: Ensure Linux build image
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"

      - name: Setup Rust caches
        uses: ./.github/actions/setup-rust-caches
        with:
          lock-hash: ${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          ocr: "true"
          sccache-key-prefix: sccache-linux-v1
          sccache-family: sccache-linux
          sccache-path: .cache/sccache-linux

      - name: Run tests + coverage
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e RUSTC_WRAPPER=/usr/local/bin/sccache-rustc-wrapper \
            -e SCCACHE_DIR=/workspace/.cache/sccache-linux \
            -e SCCACHE_CACHE_SIZE=5G \
            -e WGPU_BACKEND=vulkan \
            -e VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json \
            sqyre-linux-build \
            bash -c 'set -euo pipefail
              make coverage
              COVERAGE_REPORT_JSON=/workspace/target/coverage/summary.json make coverage-floors
              sccache --show-stats || true'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: |
            target/coverage/html
            target/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  # cargo-ndk checks need the NDK → runs on the fat android image so `test`
  # stays on the slim one. Parallel with test; only gates PR/push.
  check-android:
    if: |
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.cargo-registry.result == 'success' &&
      needs.android-image.result == 'success'
    needs: [cargo-registry, android-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Ensure Android build image
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          local-tag: sqyre-android-build:latest
          target: android
          push: "false"

      # Same target key as build-android: ndk check artifacts land in
      # target/aarch64-linux-android/debug; host deps covered by sccache.
      - name: Setup Rust caches
        uses: ./.github/actions/setup-rust-caches
        with:
          lock-hash: ${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          ocr: "true"
          target-key-prefix: cargo-target-android-v1
          target-family: cargo-target-android
          target-paths: |
            target/aarch64-linux-android
            target/android
          sccache-key-prefix: sccache-linux-v1
          sccache-family: sccache-linux
          sccache-path: .cache/sccache-linux

      - name: Run Android compile checks
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/opt/android-sdk/platform-tools:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e RUSTC_WRAPPER=/usr/local/bin/sccache-rustc-wrapper \
            -e SCCACHE_DIR=/workspace/.cache/sccache-linux \
            -e SCCACHE_CACHE_SIZE=5G \
            sqyre-android-build \
            bash -c 'set -euo pipefail
              make android-check
              sccache --show-stats || true'

  test-windows:
    if: |
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned channel (rust-toolchain.toml) isn't in the runner image; caching
      # the installed toolchains skips the ~200MB rustup download each run.
      - name: Cache Rust toolchains
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: ${{ runner.os }}-rustup-v1-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rustup-v1-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-agnostic-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-agnostic-v1-

      - name: Clippy Windows-specific crates
        run: |
          cargo clippy -p sqyre-capture -p sqyre-hotkeys -p sqyre-input -p sqyre-overlay --all-targets -- -D warnings

      - name: Test OS-agnostic crates
        run: |
          cargo test -p sqyre-domain -p sqyre-varref -p sqyre-serialize -p sqyre-validate -p sqyre-persist

  # Dist binary + AppImage + the update-signer helper in one job: the AppImage
  # packages the same stripped binary (already on disk at target/dist), and
  # sign_update_sums is a pure-Rust bin reused by the release job (same glibc
  # baseline — ubuntu 24.04 image and runner).
  build-linux:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true' &&
      needs.cargo-registry.result == 'success' &&
      needs.linux-image.result == 'success'
    needs: [version, cargo-registry, linux-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Write VERSION
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Ensure Linux build image
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"

      # Direct `cargo build` bypasses the Makefile's OCR prereq — sqyre-vision
      # include_bytes!s the models, so restore/download them here.
      - name: Setup Rust caches
        uses: ./.github/actions/setup-rust-caches
        with:
          lock-hash: ${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          ocr: "true"
          target-key-prefix: cargo-target-linux-v3
          target-family: cargo-target-linux
          target-paths: target
          sccache-key-prefix: sccache-linux-v1
          sccache-family: sccache-linux
          sccache-path: .cache/sccache-linux

      # type2-runtime download is URL+SHA256 pinned inside build-appimage.sh —
      # hashing the script tracks bumps.
      - name: Cache AppImage type2-runtime
        uses: actions/cache@v6
        with:
          path: scripts/linux/packaging/appimage/.runtime-cache
          key: appimage-runtime-v1-${{ hashFiles('scripts/linux/packaging/appimage/build-appimage.sh') }}
          restore-keys: |
            appimage-runtime-v1-

      - name: Build Linux binary + update signer
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e RUSTC_WRAPPER=/usr/local/bin/sccache-rustc-wrapper \
            -e SCCACHE_DIR=/workspace/.cache/sccache-linux \
            -e SCCACHE_CACHE_SIZE=5G \
            -e RELEASE_VERSION="$VERSION" \
            sqyre-linux-build \
            bash -c 'set -euo pipefail
              cargo build -p sqyre-app --profile dist --features portal-capture
              out="/workspace/sqyre-v${RELEASE_VERSION}-linux-amd64"
              cp "${CARGO_TARGET_DIR}/dist/sqyre" "$out"
              strip --strip-unneeded "$out"
              # Stage the stripped binary so the AppImage ships it too.
              cp "$out" "${CARGO_TARGET_DIR}/dist/sqyre"
              mkdir -p /workspace/bin
              cargo build -p sqyre-update --release --bin sign_update_sums
              cp "${CARGO_TARGET_DIR}/release/sign_update_sums" /workspace/bin/
              sccache --show-stats || true'

      - name: Build Linux AppImage
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e RELEASE_VERSION="$VERSION" \
            -e SQYRE_APPIMAGE_FORCE_NATIVE=1 \
            -e SQYRE_APPIMAGE_SKIP_BUILD=1 \
            sqyre-linux-build \
            scripts/linux/packaging/appimage/build-appimage.sh
          mv "bin/Sqyre-${VERSION}-x86_64.AppImage" \
             "Sqyre-v${VERSION}-x86_64.AppImage"

      - name: Install zip
        run: command -v zip >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zip; }

      - name: Zip Linux binary + AppImage
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          zip -9 "sqyre-v${VERSION}-linux-amd64.zip" \
            "sqyre-v${VERSION}-linux-amd64"
          # Store only: AppImage is already zstd squashfs + runtime.
          zip -0 "Sqyre-v${VERSION}-x86_64.AppImage.zip" \
            "Sqyre-v${VERSION}-x86_64.AppImage"

      - name: Upload Linux binary artifact (zipped)
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary-zip
          path: sqyre-v${{ needs.version.outputs.version }}-linux-amd64.zip

      - name: Upload Linux AppImage artifact (zipped)
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-zip
          path: Sqyre-v${{ needs.version.outputs.version }}-x86_64.AppImage.zip

      - name: Upload update-signer binary
        uses: actions/upload-artifact@v7
        with:
          name: update-signer-bin
          path: bin/sign_update_sums

  # Needs only `version`: the flatpak build is offline via the committed
  # cargo-sources.json (validated against Cargo.lock by the check job), so it
  # uses neither the host Cargo registry nor the Linux image.
  build-flatpak:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true'
    needs: [version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      # Redirect the flatpak --user installation (~GB of Platform/Sdk/extension
      # downloads) under the workspace so actions/cache can persist it. The
      # docker fallback in build-flatpak.sh does the same via docker-home.
      XDG_DATA_HOME: ${{ github.workspace }}/scripts/linux/packaging/flatpak/.flatpak-xdg/share
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Write VERSION
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Setup OCR model cache
        uses: ./.github/actions/setup-rust-caches
        with:
          lock-hash: ${{ hashFiles('Cargo.lock') }}
          ocr: "true"
          registry: "false"

      # Rolling: flathub runtimes update in place within a runtime-version, so
      # re-save each run and restore the most recent matching epoch.
      - name: Restore Flatpak runtimes + builder state
        uses: actions/cache/restore@v6
        with:
          path: |
            scripts/linux/packaging/flatpak/.flatpak-builder
            scripts/linux/packaging/flatpak/.flatpak-xdg
          key: ${{ runner.os }}-flatpak-25.08-v1-${{ hashFiles('scripts/linux/packaging/flatpak/com.sqyre.app.yml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-flatpak-25.08-v1-${{ hashFiles('scripts/linux/packaging/flatpak/com.sqyre.app.yml') }}-
            ${{ runner.os }}-flatpak-25.08-v1-

      - name: Ensure app icon PNG
        run: |
          if [ ! -f crates/sqyre-app/assets/icons/sqyre.png ]; then
            scripts/linux/packaging/generate-app-icon.sh 256
          fi

      - name: Ensure cargo-sources.json
        run: |
          if [ ! -f scripts/linux/packaging/flatpak/cargo-sources.json ]; then
            scripts/linux/packaging/flatpak/generate-cargo-sources.sh
          fi

      - name: Build Flatpak bundle
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          SQYRE_FLATPAK_FORCE_NATIVE: "1"
        run: scripts/linux/packaging/flatpak/build-flatpak.sh

      - name: Rename Flatpak bundle
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mv "bin/com.sqyre.app.flatpak" "Sqyre-v${VERSION}-x86_64.flatpak"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-flatpak
          path: Sqyre-v${{ needs.version.outputs.version }}-x86_64.flatpak

      - name: Save Flatpak runtimes + builder state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            scripts/linux/packaging/flatpak/.flatpak-builder
            scripts/linux/packaging/flatpak/.flatpak-xdg
          key: ${{ runner.os }}-flatpak-25.08-v1-${{ hashFiles('scripts/linux/packaging/flatpak/com.sqyre.app.yml') }}-${{ github.run_id }}

  build-windows:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true' &&
      needs.cargo-registry.result == 'success'
    needs: [version, cargo-registry]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Write VERSION
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Ensure Windows cross image
        uses: ./.github/actions/ensure-windows-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"

      # Profile is `dist` (SQYRE_CARGO_PROFILE default): target/<triple>/dist for
      # the exe, target/dist for host deps (build scripts / proc macros). OCR
      # models are restored here so build.sh doesn't re-download them.
      - name: Setup Rust caches
        uses: ./.github/actions/setup-rust-caches
        with:
          lock-hash: ${{ hashFiles('Cargo.lock', 'scripts/windows/Dockerfile', 'scripts/windows/build-mingw-deps.sh', 'scripts/windows/mingw-lld-link.sh', 'scripts/windows/sccache-rustc-wrapper.sh') }}
          ocr: "true"
          target-key-prefix: cargo-target-windows-gnu-v3
          target-family: cargo-target-windows
          target-paths: |
            target/x86_64-pc-windows-gnu
            target/dist
          sccache-key-prefix: sccache-windows-v3
          sccache-family: sccache-windows
          sccache-path: .cache/sccache-windows

      - name: Prepare bin dir
        run: mkdir -p bin

      - name: Build Windows binary
        env:
          SQYRE_WINDOWS_IMAGE: sqyre-windows-cross:latest
          SQYRE_WINDOWS_SKIP_PULL: "1"
          SQYRE_WINDOWS_SCCACHE: "1"
          SCCACHE_CACHE_SIZE: 5G
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          CARGO_HOME: ${{ github.workspace }}/${{ env.CARGO_HOME_DIR }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/${{ env.CARGO_TARGET_DIR_HOST }}
        run: ./scripts/windows/build.sh

      - name: Install zip
        run: command -v zip >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zip; }

      - name: Zip Windows binary
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cp -f bin/sqyre.exe "sqyre-v${VERSION}-windows-amd64.exe"
          zip -0 "sqyre-v${VERSION}-windows-amd64.zip" \
            "sqyre-v${VERSION}-windows-amd64.exe"

      - name: Upload Windows binary artifact (zipped)
        uses: actions/upload-artifact@v7
        with:
          name: windows-binary-zip
          path: sqyre-v${{ needs.version.outputs.version }}-windows-amd64.zip

  build-wasm:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true' &&
      needs.cargo-registry.result == 'success' &&
      needs.linux-image.result == 'success'
    needs: [version, cargo-registry, linux-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Write VERSION
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Ensure Linux build image
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"

      # index.html maps --release to the `dist` cargo profile: wasm output lands
      # in target/wasm32-unknown-unknown/dist, host deps in target/dist.
      - name: Setup Rust caches
        uses: ./.github/actions/setup-rust-caches
        with:
          lock-hash: ${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          ocr: "true"
          target-key-prefix: cargo-target-wasm32-v3
          target-family: cargo-target-wasm
          target-paths: |
            target/wasm32-unknown-unknown
            target/dist
          sccache-key-prefix: sccache-linux-v1
          sccache-family: sccache-linux
          sccache-path: .cache/sccache-linux
          extra-dirs: .cache/xdg-tools

      # Trunk downloads wasm-bindgen + wasm-opt into XDG_CACHE_HOME on first use;
      # HOME=/tmp in the container would re-download every run.
      - name: Cache Trunk tools
        uses: actions/cache@v6
        with:
          path: .cache/xdg-tools
          key: ${{ runner.os }}-trunk-tools-v1-${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-trunk-tools-v1-

      - name: Build WASM editor
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e XDG_CACHE_HOME=/workspace/.cache/xdg-tools \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e RUSTC_WRAPPER=/usr/local/bin/sccache-rustc-wrapper \
            -e SCCACHE_DIR=/workspace/.cache/sccache-linux \
            -e SCCACHE_CACHE_SIZE=5G \
            -e RELEASE_VERSION="$VERSION" \
            -e SQYRE_SKIP_GATE=1 \
            sqyre-linux-build \
            bash -c 'set -euo pipefail
              make wasm
              test -f bin/wasm/index.html
              sccache --show-stats || true'

      - name: Install zip
        run: command -v zip >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y zip; }

      - name: Zip WASM editor
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          (cd bin/wasm && zip -9r "../../sqyre-v${VERSION}-wasm.zip" .)

      - name: Upload WASM artifact (zipped)
        uses: actions/upload-artifact@v7
        with:
          name: wasm-editor-zip
          path: sqyre-v${{ needs.version.outputs.version }}-wasm.zip

  # Signed arm64 release APK. Needs the SQYRE_ANDROID_* secrets; the release fails
  # without them, same as SQYRE_UPDATE_SIGNING_KEY.
  build-android:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true' &&
      needs.cargo-registry.result == 'success' &&
      needs.android-image.result == 'success'
    needs: [version, cargo-registry, android-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Write VERSION
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Decode Android release keystore
        env:
          SQYRE_ANDROID_KEYSTORE: ${{ secrets.SQYRE_ANDROID_KEYSTORE }}
          SQYRE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SQYRE_ANDROID_KEYSTORE_PASSWORD }}
          SQYRE_ANDROID_KEY_ALIAS: ${{ secrets.SQYRE_ANDROID_KEY_ALIAS }}
          SQYRE_ANDROID_KEY_PASSWORD: ${{ secrets.SQYRE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in SQYRE_ANDROID_KEYSTORE SQYRE_ANDROID_KEYSTORE_PASSWORD SQYRE_ANDROID_KEY_ALIAS SQYRE_ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "$var secret is required to publish a signed APK" >&2
              exit 1
            fi
          done
          mkdir -p bin
          echo "$SQYRE_ANDROID_KEYSTORE" | base64 -d > bin/android-release.keystore
          test -s bin/android-release.keystore

      # android-image already built/pushed; pull or rebuild from Buildx cache (fork PRs).
      - name: Ensure Android build image
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          local-tag: sqyre-android-build:latest
          target: android
          push: "false"

      # ANDROID_PROFILE=release → target/aarch64-linux-android/release for the
      # cdylib, target/release for host deps (build scripts / proc macros).
      - name: Setup Rust caches
        uses: ./.github/actions/setup-rust-caches
        with:
          lock-hash: ${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          ocr: "true"
          target-key-prefix: cargo-target-android-v1
          target-family: cargo-target-android
          target-paths: |
            target/aarch64-linux-android
            target/android
            target/release
          sccache-key-prefix: sccache-linux-v1
          sccache-family: sccache-linux
          sccache-path: .cache/sccache-linux
          extra-dirs: .cache/gradle

      # Rolling: Gradle dep/plugin caches accumulate across runs.
      - name: Restore Gradle
        uses: actions/cache/restore@v6
        with:
          path: .cache/gradle
          key: ${{ runner.os }}-gradle-v1-${{ hashFiles('android/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gradle-v1-${{ hashFiles('android/**') }}-
            ${{ runner.os }}-gradle-v1-

      - name: Build and sign Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SQYRE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.SQYRE_ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.SQYRE_ANDROID_KEY_PASSWORD }}
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/opt/gradle/bin:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e RUSTC_WRAPPER=/usr/local/bin/sccache-rustc-wrapper \
            -e SCCACHE_DIR=/workspace/.cache/sccache-linux \
            -e SCCACHE_CACHE_SIZE=5G \
            -e GRADLE_USER_HOME=/workspace/.cache/gradle \
            -e RELEASE_VERSION="${{ needs.version.outputs.version }}" \
            -e SQYRE_SKIP_GATE=1 \
            -e ANDROID_PROFILE=release \
            -e ANDROID_ABIS=arm64-v8a \
            -e ANDROID_KEYSTORE_FILE=/workspace/bin/android-release.keystore \
            -e ANDROID_KEYSTORE_PASSWORD \
            -e ANDROID_KEYSTORE_ALIAS \
            -e ANDROID_KEYSTORE_KEY_PASSWORD \
            sqyre-android-build \
            bash -c 'set -euo pipefail
              make android
              test -f bin/sqyre-release.apk
              apksigner="$(ls -d /opt/android-sdk/build-tools/* | sort -V | tail -n1)/apksigner"
              "$apksigner" verify bin/sqyre-release.apk
              sccache --show-stats || true'

      - name: Remove keystore
        if: always()
        run: rm -f bin/android-release.keystore

      - name: Rename APK for release
        run: cp bin/sqyre-release.apk "sqyre-v${{ needs.version.outputs.version }}-android-arm64.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: sqyre-v${{ needs.version.outputs.version }}-android-arm64.apk

      - name: Save Gradle
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/gradle
          key: ${{ runner.os }}-gradle-v1-${{ hashFiles('android/**') }}-${{ github.run_id }}

  release:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true' &&
      needs.build-linux.result == 'success' &&
      needs.build-flatpak.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-wasm.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.check.result == 'success'
    needs: [version, check, build-linux, build-flatpak, build-windows, build-wasm, build-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release zip artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-zip"
          path: artifacts

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-flatpak
          path: artifacts/linux-flatpak

      - name: Download Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts/android-apk

      # sign_update_sums is built in build-linux's container — pure Rust, no
      # native deps — so no toolchain/checkout/registry is needed here.
      - name: Download update-signer binary
        uses: actions/download-artifact@v8
        with:
          name: update-signer-bin
          path: signer

      - name: Assemble release files and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/linux-binary-zip/*.zip release/
          cp artifacts/linux-appimage-zip/*.zip release/
          cp artifacts/linux-flatpak/*.flatpak release/
          cp artifacts/windows-binary-zip/*.zip release/
          cp artifacts/wasm-editor-zip/*.zip release/
          cp artifacts/android-apk/*.apk release/
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Sign SHA256SUMS (Ed25519)
        env:
          SQYRE_UPDATE_SIGNING_KEY: ${{ secrets.SQYRE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SQYRE_UPDATE_SIGNING_KEY:-}" ]; then
            echo "SQYRE_UPDATE_SIGNING_KEY secret is required to publish signed releases" >&2
            exit 1
          fi
          chmod +x signer/sign_update_sums
          signer/sign_update_sums "${{ needs.version.outputs.version }}" release/SHA256SUMS
          ls -la release/SHA256SUMS release/SHA256SUMS.sig

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release v${{ needs.version.outputs.version }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
