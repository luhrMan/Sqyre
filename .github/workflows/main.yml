# CI on push/PR to main. Daily release at 23:00 UTC when main has changed.
# Releases: Linux binary + AppImage, Windows .exe (MinGW cross), WASM editor zip.
# Release tag / artifact names: vYYYY.MM.DD (e.g. v2026.03.03); HHMM suffix if that tag exists.
#
# Caching (share what can be shared):
# - Cargo registry (.cache/cargo): one key for all Linux jobs — warmed once per run
# - Cargo target/: per triple (linux host / windows-gnu / wasm32) — not cross-shareable
# - Linux/Windows Docker images: content-hash tags on GHCR; Buildx layers as fallback
# - tessdata: shared keys across runs

name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    # End of day UTC — only publishes when main moved since the last release tag.
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  # Shared with docker run mounts (see jobs below).
  CARGO_HOME_DIR: .cache/cargo
  CARGO_TARGET_DIR_HOST: target
  # Push runnable images from non-fork PRs and all other events.
  GHCR_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  version:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Decide whether to release
        id: check
        run: |
          set -euo pipefail
          # Latest SemVer-ish / date tag (vYYYY.MM.DD or vYYYY.MM.DD.HHMM).
          LATEST_TAG="$(git tag -l 'v*' --sort=-version:refname | head -n1 || true)"

          if [ -z "$LATEST_TAG" ]; then
            echo "No prior release tag; releasing HEAD."
            SHOULD_RELEASE=true
          else
            # Match push paths-ignore: ignore docs-only / markdown-only changes.
            RELEASABLE="$(git diff --name-only "${LATEST_TAG}..HEAD" \
              | grep -Ev '(^docs/|\.md$)' || true)"
            if [ -n "$RELEASABLE" ]; then
              echo "Releasable changes since ${LATEST_TAG}:"
              echo "$RELEASABLE"
              SHOULD_RELEASE=true
            else
              echo "No releasable changes since ${LATEST_TAG}; skipping release."
              SHOULD_RELEASE=false
            fi
          fi

          VERSION="$(date -u +%Y.%m.%d)"
          if [ "$SHOULD_RELEASE" = true ] && git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            VERSION="$(date -u +%Y.%m.%d.%H%M)"
            echo "Tag v$(date -u +%Y.%m.%d) already exists; using v${VERSION}."
          fi

          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Shared gate: push/PR always; release events only when publishing.
  # `version` is skipped on push/PR — use always() so dependents still run.
  cargo-registry:
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (needs.version.result == 'success' && needs.version.outputs.should_release == 'true')
      )
    needs: [version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || github.sha }}

      - name: Cache Cargo registry (shared)
        id: reg
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_HOME_DIR }}
          key: ${{ runner.os }}-cargo-reg-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-v3-
            ${{ runner.os }}-cargo-reg-

      - name: Install Rust toolchain
        if: steps.reg.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Fetch crate sources
        if: steps.reg.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.CARGO_HOME_DIR }}"
          CARGO_HOME="${{ github.workspace }}/${{ env.CARGO_HOME_DIR }}" cargo fetch --locked

  linux-image:
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (needs.version.result == 'success' && needs.version.outputs.should_release == 'true')
      )
    needs: [version]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ensure.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || github.sha }}

      - name: Ensure Linux build image
        id: ensure
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ env.GHCR_PUSH }}

  windows-image:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true'
    needs: [version]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ensure.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Ensure Windows cross image
        id: ensure
        uses: ./.github/actions/ensure-windows-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"

  test:
    if: |
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.cargo-registry.result == 'success' &&
      needs.linux-image.result == 'success'
    needs: [cargo-registry, linux-image]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      # linux-image already built/pushed; pull or rebuild from Buildx cache (fork PRs).
      - name: Ensure Linux build image
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"

      - name: Cache tessdata
        id: tessdata-test
        uses: actions/cache@v6
        with:
          path: assets/tessdata
          key: tessdata-eng-v2

      - name: Download tessdata
        if: steps.tessdata-test.outputs.cache-hit != 'true'
        run: ./scripts/download-tessdata.sh

      - name: Cache Cargo registry (shared)
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_HOME_DIR }}
          key: ${{ runner.os }}-cargo-reg-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-v3-
            ${{ runner.os }}-cargo-reg-

      - name: Cache Cargo target (Linux host)
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_TARGET_DIR_HOST }}
          key: ${{ runner.os }}-cargo-target-linux-v3-${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-linux-v3-
            ${{ runner.os }}-cargo-target-

      - name: Prepare Cargo cache dirs
        run: mkdir -p "${{ env.CARGO_HOME_DIR }}" "${{ env.CARGO_TARGET_DIR_HOST }}"

      - name: Run Rust quality checks and tests
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/bin:/bin \
            -e WGPU_BACKEND=vulkan \
            -e VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            sqyre-linux-build \
            bash -c 'set -euo pipefail
              make check
              make machete
              make test'

      - name: Coverage report
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/bin:/bin \
            -e WGPU_BACKEND=vulkan \
            -e VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            sqyre-linux-build \
            bash -c 'set -euo pipefail
              make coverage
              make coverage-floors'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            target/coverage/html
            target/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  build-linux:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true' &&
      needs.cargo-registry.result == 'success' &&
      needs.linux-image.result == 'success'
    needs: [version, cargo-registry, linux-image]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Write VERSION
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Ensure Linux build image
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"

      - name: Cache tessdata
        id: tessdata-linux
        uses: actions/cache@v6
        with:
          path: assets/tessdata
          key: tessdata-eng-v2

      - name: Download tessdata
        if: steps.tessdata-linux.outputs.cache-hit != 'true'
        run: ./scripts/download-tessdata.sh

      - name: Cache Cargo registry (shared)
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_HOME_DIR }}
          key: ${{ runner.os }}-cargo-reg-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-v3-
            ${{ runner.os }}-cargo-reg-

      - name: Cache Cargo target (Linux host)
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_TARGET_DIR_HOST }}
          key: ${{ runner.os }}-cargo-target-linux-v3-${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-linux-v3-
            ${{ runner.os }}-cargo-target-

      - name: Prepare Cargo cache dirs
        run: mkdir -p "${{ env.CARGO_HOME_DIR }}" "${{ env.CARGO_TARGET_DIR_HOST }}"

      - name: Build Linux binary and AppImage
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e RELEASE_VERSION="$VERSION" \
            -e SQYRE_APPIMAGE_FORCE_NATIVE=1 \
            sqyre-linux-build \
            bash -c 'set -euo pipefail
              scripts/linux/packaging/appimage/build-appimage.sh
              cp scripts/linux/packaging/appimage/sqyre.AppDir/usr/bin/sqyre \
                "/workspace/sqyre-v${RELEASE_VERSION}-linux-amd64"'
          mv "bin/Sqyre-${VERSION}-x86_64.AppImage" \
             "Sqyre-v${VERSION}-x86_64.AppImage"

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Zip Linux binary
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          zip -9 "sqyre-v${VERSION}-linux-amd64.zip" \
            "sqyre-v${VERSION}-linux-amd64"

      - name: Zip Linux AppImage
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          zip -9 "Sqyre-v${VERSION}-x86_64.AppImage.zip" \
            "Sqyre-v${VERSION}-x86_64.AppImage"

      - name: Upload Linux binary artifact (zipped)
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary-zip
          path: sqyre-v${{ needs.version.outputs.version }}-linux-amd64.zip

      - name: Upload Linux AppImage artifact (zipped)
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-zip
          path: Sqyre-v${{ needs.version.outputs.version }}-x86_64.AppImage.zip

  build-windows:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true' &&
      needs.cargo-registry.result == 'success' &&
      needs.windows-image.result == 'success'
    needs: [version, cargo-registry, windows-image]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Write VERSION
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Ensure Windows cross image
        uses: ./.github/actions/ensure-windows-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"

      - name: Cache Cargo registry (shared)
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_HOME_DIR }}
          key: ${{ runner.os }}-cargo-reg-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-v3-
            ${{ runner.os }}-cargo-reg-

      - name: Cache Cargo target (Windows cross)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR_HOST }}/x86_64-pc-windows-gnu
            ${{ env.CARGO_TARGET_DIR_HOST }}/release
          key: ${{ runner.os }}-cargo-target-windows-gnu-v3-${{ hashFiles('Cargo.lock', 'scripts/windows/Dockerfile', 'scripts/windows/build-mingw-deps.sh', 'scripts/windows/mingw-lld-link.sh', 'scripts/windows/sccache-rustc-wrapper.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-windows-gnu-v3-
            ${{ runner.os }}-cargo-target-windows-

      - name: Cache sccache (Windows cross)
        uses: actions/cache@v6
        with:
          path: .cache/sccache-windows
          key: ${{ runner.os }}-sccache-windows-v3-${{ hashFiles('Cargo.lock', 'scripts/windows/Dockerfile', 'scripts/windows/build-mingw-deps.sh', 'scripts/windows/mingw-lld-link.sh', 'scripts/windows/sccache-rustc-wrapper.sh') }}
          restore-keys: |
            ${{ runner.os }}-sccache-windows-v3-
            ${{ runner.os }}-sccache-windows-

      - name: Prepare Cargo cache dirs
        run: mkdir -p "${{ env.CARGO_HOME_DIR }}" "${{ env.CARGO_TARGET_DIR_HOST }}" .cache/sccache-windows bin

      - name: Build Windows binary
        env:
          SQYRE_WINDOWS_IMAGE: sqyre-windows-cross:latest
          SQYRE_WINDOWS_SKIP_PULL: "1"
          SQYRE_WINDOWS_SCCACHE: "1"
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          CARGO_HOME: ${{ github.workspace }}/${{ env.CARGO_HOME_DIR }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/${{ env.CARGO_TARGET_DIR_HOST }}
        run: ./scripts/windows/build.sh

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Zip Windows binary
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cp -f bin/sqyre.exe "sqyre-v${VERSION}-windows-amd64.exe"
          zip -9 "sqyre-v${VERSION}-windows-amd64.zip" \
            "sqyre-v${VERSION}-windows-amd64.exe"

      - name: Upload Windows binary artifact (zipped)
        uses: actions/upload-artifact@v7
        with:
          name: windows-binary-zip
          path: sqyre-v${{ needs.version.outputs.version }}-windows-amd64.zip

  build-wasm:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true' &&
      needs.cargo-registry.result == 'success' &&
      needs.linux-image.result == 'success'
    needs: [version, cargo-registry, linux-image]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Write VERSION
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Ensure Linux build image
        uses: ./.github/actions/ensure-linux-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "false"

      - name: Cache Cargo registry (shared)
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_HOME_DIR }}
          key: ${{ runner.os }}-cargo-reg-v3-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg-v3-
            ${{ runner.os }}-cargo-reg-

      - name: Cache Cargo target (WASM)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR_HOST }}/wasm32-unknown-unknown
            ${{ env.CARGO_TARGET_DIR_HOST }}/release
          key: ${{ runner.os }}-cargo-target-wasm32-v3-${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-wasm32-v3-
            ${{ runner.os }}-cargo-target-wasm-

      - name: Prepare Cargo cache dirs
        run: mkdir -p "${{ env.CARGO_HOME_DIR }}" "${{ env.CARGO_TARGET_DIR_HOST }}"

      - name: Build WASM editor
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker run --rm -u "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace -w /workspace \
            -e HOME=/tmp \
            -e CARGO_HOME=/workspace/${{ env.CARGO_HOME_DIR }} \
            -e CARGO_TARGET_DIR=/workspace/${{ env.CARGO_TARGET_DIR_HOST }} \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -e RELEASE_VERSION="$VERSION" \
            sqyre-linux-build \
            bash -c 'set -euo pipefail
              make wasm
              test -f bin/wasm/index.html'

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Zip WASM editor
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          (cd bin/wasm && zip -9r "../../sqyre-v${VERSION}-wasm.zip" .)

      - name: Upload WASM artifact (zipped)
        uses: actions/upload-artifact@v7
        with:
          name: wasm-editor-zip
          path: sqyre-v${{ needs.version.outputs.version }}-wasm.zip

  release:
    if: |
      always() && !cancelled() &&
      needs.version.result == 'success' &&
      needs.version.outputs.should_release == 'true' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-wasm.result == 'success'
    needs: [version, build-linux, build-windows, build-wasm]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release zip artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-zip"
          path: artifacts

      - name: Assemble release files and SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/linux-binary-zip/*.zip release/
          cp artifacts/linux-appimage-zip/*.zip release/
          cp artifacts/windows-binary-zip/*.zip release/
          cp artifacts/wasm-editor-zip/*.zip release/
          (cd release && sha256sum *.zip > SHA256SUMS)
          cat release/SHA256SUMS

      - uses: actions/checkout@v6
        with:
          path: src
          ref: ${{ needs.version.outputs.sha }}

      - name: Install Rust toolchain (sign checksums)
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Verify update public key is configured
        working-directory: src
        run: |
          set -euo pipefail
          PUBKEY_FILE="crates/sqyre-update/update_pubkey.hex"
          PUBKEY="$(tr -d '[:space:]' < "$PUBKEY_FILE")"
          if [ -z "$PUBKEY" ] || [ "$(printf '%s' "$PUBKEY" | tr '[:upper:]' '[:lower:]')" = "unconfigured" ]; then
            echo "$PUBKEY_FILE must contain the configured update public key before signing a release" >&2
            exit 1
          fi

      - name: Sign SHA256SUMS (Ed25519)
        working-directory: src
        env:
          SQYRE_UPDATE_SIGNING_KEY: ${{ secrets.SQYRE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SQYRE_UPDATE_SIGNING_KEY:-}" ]; then
            echo "SQYRE_UPDATE_SIGNING_KEY secret is required to publish signed releases" >&2
            exit 1
          fi
          cargo run -q -p sqyre-update --bin sign_update_sums -- ../release/SHA256SUMS
          ls -la ../release/SHA256SUMS ../release/SHA256SUMS.sig

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release v${{ needs.version.outputs.version }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
