version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # dtolnay pre-creates heads like 1.120.0 for future rustc releases; Dependabot
    # treats those as newer action versions even though rustc is not released yet.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
